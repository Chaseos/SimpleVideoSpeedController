<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Simple Video Speed Controller</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.6 system-ui, sans-serif;
      --page: #f5f5f7; --surface: #fff; --text: #1d1d1f; --secondary: #59595f; --border: #dedee3; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--page); color: var(--text); }
    main { max-width: 560px; margin: 10vh auto; padding: 32px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px; }
    header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    img { flex: none; border-radius: 12px; }
    .app-name { margin: 0; font-weight: 600; line-height: 1.4; }
    h1 { margin: 0 0 12px; font-size: 1.65rem; line-height: 1.25; letter-spacing: -.02em; }
    .explanation { margin: 0; color: var(--secondary); }
    a { display: block; margin-top: 28px; padding: 14px 18px; border-radius: 12px;
      background: #215bd8; color: white; font-weight: 600; text-align: center; text-decoration: none; }
    a:hover { background: #194bb9; }
    a:focus-visible { outline: 3px solid var(--text); outline-offset: 4px; }
    .reassurance { margin: 14px 0 0; color: var(--secondary); font-size: .875rem; text-align: center; }
    @media (max-width: 420px) { body { padding: 16px; } main { margin: 24px auto; padding: 24px; } }
    @media (prefers-color-scheme: dark) {
      :root { --page: #161618; --surface: #232326; --text: #f5f5f7; --secondary: #b5b5bd; --border: #3b3b40; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icon-128.png" width="48" height="48" alt="">
      <p class="app-name">Simple Video Speed Controller</p>
    </header>
    <h1 data-i18n="supportPageTitle">Support continued development</h1>
    <p class="explanation" data-i18n="supportPageExplanation">To leave an optional tip, open the app. Payments are handled securely by Apple.</p>
    <a href="__APPLE_SUPPORT_URL__" data-i18n="openVideoSpeed">Open Simple Video Speed Controller</a>
    <p class="reassurance" data-i18n="supportPageReassurance">Opening the app won’t make a purchase.</p>
  </main>
  <script src="support.js"></script>
</body>
</html>
